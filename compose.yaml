services:
  frontend:
    build: .
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - frontend_modules:/app/node_modules
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
volumes:
  frontend_modules:
